version: '3.8'

services:

  redis:
    image: redis
    ports:
    - "6379:6379"
    expose:
      - 6379
    security_opt:
      - seccomp:unconfined
    profiles:
      - product

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
      - mysqldb
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysqldb:3306/${MYSQL_DATABASE}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./uploads:/usr/blog/uploads
    profiles:
      - product

  mysqldb:
    image: mysql:5.7
    env_file:
      - .env
    ports:
      - "${MYSQL_PORT}:3306"
    expose:
      - 3306
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      SERVICE_TAGS: prod
      SERVICE_NAME: mysqldb
    volumes:
      - ./db-data:/var/lib/mysql
    profiles:
      - product

  mysqldb-test:
    image: mysql:5.7
    ports:
      - '3308:3306'
    environment:
      MYSQL_DATABASE: blog
      MYSQL_USER: prisma
      MYSQL_PASSWORD: prisma
      MYSQL_ROOT_PASSWORD: prisma
      SERVICE_TAGS: prod
      SERVICE_NAME: mysqldb
    profiles:
      - test

volumes:
  db-data:
  uploads:
